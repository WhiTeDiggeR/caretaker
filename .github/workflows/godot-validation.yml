name: Godot validation

on:
  push:
    branches:
      - main
      - team/integration
  pull_request:
    branches:
      - team/integration

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7-stable
      GODOT_BINARY: Godot_v4.7-stable_linux.x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The set-dressing check compares scenes with a committed baseline read through `git show`.
          fetch-depth: 0

      - name: Install Godot 4.7 stable
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v4.7-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "${GODOT_BINARY}"

      - name: Import project and validate resources
        shell: bash
        run: ./"${GODOT_BINARY}" --headless --editor --path . --quit

      - name: Smoke-test startup scene
        shell: bash
        run: ./"${GODOT_BINARY}" --headless --path . --quit-after 5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Python suites, scene/registry indexes and every headless Godot check (tools/ci/run_checks.sh).
      # Tests that need svg-plan-to-godot / generate-godot-stairs skip themselves here: those tools are
      # not part of the repository, so they run locally with SVG_TOOL_ROOT / STAIR_TOOL_ROOT set.
      - name: Run repository checks
        shell: bash
        run: GODOT_BIN="${PWD}/${GODOT_BINARY}" bash tools/ci/run_checks.sh
