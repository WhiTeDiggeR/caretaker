labels:
  - name: status:triage
    color: d4c5f9
    description: Needs clarification or decomposition
  - name: status:ready
    color: 0e8a16
    description: Ready for an executor
  - name: status:in-progress
    color: fbca04
    description: Work is actively owned
  - name: status:blocked
    color: b60205
    description: Progress requires an external decision or dependency
  - name: status:verification
    color: 1d76db
    description: Implementation complete; checks are running
  - name: status:done
    color: 006b75
    description: Integrated and verified
  - name: agent:codex
    color: 5319e7
    description: Preferred executor is Codex
  - name: agent:copilot
    color: 0969da
    description: Preferred executor is GitHub Copilot
  - name: agent:human
    color: c2e0c6
    description: Requires a human executor
  - name: agent:any
    color: ededed
    description: Dispatcher may select any executor
  - name: area:gameplay
    color: f9d0c4
    description: Gameplay code or interaction
  - name: area:scene
    color: fef2c0
    description: Scene composition or node hierarchy
  - name: area:art
    color: c5def5
    description: Models, textures, materials, or visual direction
  - name: area:audio
    color: bfdadc
    description: Music, ambience, or sound effects
  - name: area:tooling
    color: d4c5f9
    description: CI, import, repository, or developer tooling
