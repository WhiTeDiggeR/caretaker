<text x="900.0" y="222.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Материалы</text>

<text x="900.0" y="242.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Ткань и кожа матовые, «пиксельная» текстура 8 текселей на</text>

<text x="910.0" y="259.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">голову; глаза — эмиссия без зрачков.</text>

<text x="900.0" y="276.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Внутри капсулы — жидкость: модель без собственной подсветки,</text>

<text x="910.0" y="293.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">свет даёт капсула.</text>

<text x="900.0" y="318.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Ключевые детали</text>

<text x="900.0" y="338.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Кубическая голова 8 × 8, туловище 8 × 12, руки и ноги 4 × 12 —</text>

<text x="910.0" y="355.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">это и есть образ.</text>

<text x="900.0" y="372.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Белые глаза без зрачков, ровное свечение — единственный</text>

<text x="910.0" y="389.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">«живой» сигнал.</text>

<text x="900.0" y="406.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Короткие рукава, тёмные волосы шапкой, без лишних аксессуаров.</text>

<text x="900.0" y="431.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Поза</text>

<text x="900.0" y="451.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Свёрнут на левом боку, нижняя рука под подбородком, верхняя</text>

<text x="910.0" y="468.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">лежит вперёд.</text>

<text x="900.0" y="485.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Статика, без рига; позу задаёт скрипт (_HB_POSE).</text>

<text x="900.0" y="510.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Масштаб</text>

<text x="900.0" y="530.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• 2,24 м в рост (на 0,44 м выше игрока); в капсуле ≈ 2,2 × 1,3 ×</text>

<text x="910.0" y="547.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">1,0 м, центр — сокет окна.</text>

<text x="900.0" y="572.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Канон</text>

<text x="900.0" y="592.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• docs/world/05-prisoners-and-characters.md: объект №3, первая</text>

<text x="910.0" y="609.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">опытная капсула; капсула в холодной синей гамме, аномалия и</text>

<text x="910.0" y="626.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">искажения. Риск узнаваемости — О-10.</text>

<text x="900.0" y="651.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Для генерации (этап 2)</text>

<text x="900.0" y="671.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• См. В-3: блочную форму генераторы делают хуже скрипта.</text>

<text x="910.0" y="688.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Рекомендация — скрипт + новая скин-текстура, без генерации.</text>

</svg>
