<text x="680.0" y="681.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">колени подтянуты; плавает — пол капсулы не касается</text>
<text x="680.0" y="255.0" font-size="12" fill="#8cc8ff" text-anchor="middle" font-weight="400">холодная синяя гамма капсулы, свечение глаз — EyeGlow</text>
<text x="900.0" y="112.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Палитра</text>

