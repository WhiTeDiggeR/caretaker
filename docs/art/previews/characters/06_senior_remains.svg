<text x="32" y="44" font-size="24" font-weight="700" fill="#efe7dc">Ст-01 · Останки старшего сотрудника — кабинет, под сорвавшейся трубой</text>
<text x="32" y="70" font-size="14" fill="#b0a59c">Комплекс, старое ядро: L-OLD-CORE/senior_room (Р-2, #170, #178). Осмотр senior_body, ключ на шнурке. Сейчас: бокс-примитив и труба в breach_station.gd (_build_body), в комплексе модели нет</text>
