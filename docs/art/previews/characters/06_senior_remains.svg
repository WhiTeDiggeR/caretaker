<text x="775.0" y="486.0" font-size="11" fill="#b0a59c" text-anchor="middle" font-weight="400">игрок 1,8 м</text>
<text x="450.0" y="500.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">сбоку: на правом боку у подножия пульта, лицом к пролому; стояк сорвался с потолка и лёг</text>
<text x="450.0" y="516.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">верхним концом на край пульта, поперёк груди, нижним — на пол. Крови нет, глаза закрыты</text>
