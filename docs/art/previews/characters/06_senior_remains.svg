<rect x="133.0" y="819.2" width="527.0" height="6.8" fill="#4d4247" />
<text x="670.2" y="826.0" font-size="11" fill="#b0a59c" text-anchor="start" font-weight="400">пролом в релейную</text>
<text x="450.0" y="852.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">сверху: кружка и перевёрнутая фотография на пульте, ключ на шнурке у руки</text>
<text x="900.0" y="112.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Палитра</text>

<rect x="900" y="118" width="22" height="22" rx="4" fill="#2f3a4a" stroke="#3a3238"/>
<text x="930.0" y="133.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">китель старшего</text>

<text x="930.0" y="145.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#2f3a4a</text>

<rect x="1140" y="118" width="22" height="22" rx="4" fill="#3b424a" stroke="#3a3238"/>
<text x="1170.0" y="133.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">брюки</text>

<text x="1170.0" y="145.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#3b424a</text>

<rect x="900" y="146" width="22" height="22" rx="4" fill="#d8c46a" stroke="#3a3238"/>
<text x="930.0" y="161.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">нашивка, полоса</text>

<text x="930.0" y="173.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#d8c46a</text>

<rect x="1140" y="146" width="22" height="22" rx="4" fill="#c8aa98" stroke="#3a3238"/>
<text x="1170.0" y="161.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">кожа, бледная</text>

<text x="1170.0" y="173.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#c8aa98</text>

<rect x="900" y="174" width="22" height="22" rx="4" fill="#8d8a86" stroke="#3a3238"/>
<text x="930.0" y="189.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">седина</text>

<text x="930.0" y="201.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#8d8a86</text>

<rect x="1140" y="174" width="22" height="22" rx="4" fill="#6b5a4a" stroke="#3a3238"/>
<text x="1170.0" y="189.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">стояк, ржавая сталь</text>

<text x="1170.0" y="201.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#6b5a4a</text>

<text x="900.0" y="222.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Материалы</text>

<text x="900.0" y="242.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Плотный тёмный китель поверх комбинезона персонала, нашивка</text>

<text x="910.0" y="259.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">старшего на рукаве, пропуск на груди без текста.</text>

<text x="900.0" y="276.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Кожа бледная, без ран и крови (сцена «тихая», 01-opening).</text>

<text x="910.0" y="293.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Пыль от пролома на плечах.</text>

<text x="900.0" y="310.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Стояк — стальная труба Ø 0,15 м, ржавчина, оторванный фланец и</text>

<text x="910.0" y="327.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">скоба.</text>

<text x="900.0" y="352.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Ключевые детали</text>

<text x="900.0" y="372.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Лицо видно со стороны пролома: глаза закрыты, «будто задремал»</text>

<text x="910.0" y="389.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">(senior_body).</text>

<text x="900.0" y="406.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Шнурок с ключом выпал из ворота и лежит у руки — ключ остаётся</text>

<text x="910.0" y="423.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">отдельным подбором.</text>

<text x="900.0" y="440.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Стояк придавил грудь: одежда смята под трубой, тело и труба не</text>

<text x="910.0" y="457.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">пересекаются.</text>

<text x="900.0" y="482.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Поза</text>

<text x="900.0" y="502.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• На правом боку у подножия пульта, колени чуть согнуты, нижняя</text>

<text x="910.0" y="519.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">рука под телом, верхняя к ключу (В-8 «а»).</text>

<text x="900.0" y="536.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Статика, без рига. Генерация в A-позе + поза в Blender по</text>

<text x="910.0" y="553.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">авторигу, затем риг удаляется.</text>

<text x="900.0" y="578.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Масштаб</text>

<text x="900.0" y="598.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Рост 1,78 м, лёжа ≈ 1,7 × 0,5 × 0,3 м. Стояк ≈ 2,6 м (как в</text>

<text x="910.0" y="615.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">breach_station), пульт 0,9–1,1 м.</text>

<text x="900.0" y="640.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Канон</text>

<text x="900.0" y="660.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• 01-opening Р-2: удар побега объекта №1 сорвал стояк, он убил</text>

<text x="910.0" y="677.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">старшего и проломил стену к релейной; «первое тело в игре»;</text>

<text x="910.0" y="694.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">senior_body: «лежит у пульта, стояк придавил его». 03-complex:</text>

<text x="910.0" y="711.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">ключ старшего.</text>

<text x="900.0" y="736.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Для генерации (этап 2)</text>

<text x="900.0" y="756.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• До 8 тыс. треугольников, 1K. Трубу — мешем сцены (В-9 «а»),</text>

<text x="910.0" y="773.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">фото и кружка уже есть (personal_items.gd).</text>

</svg>
