<text x="1170.0" y="189.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">молот, дерево</text>

<text x="1170.0" y="201.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#6b4a2e</text>

<text x="900.0" y="222.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Материалы</text>

<text x="900.0" y="242.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Плащ — грубая шерсть, рваные края, пыль и пепел. Кости —</text>

<text x="910.0" y="259.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">матовые, тёплые, без глянца.</text>

<text x="900.0" y="276.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Кепка — выцветшая красная ткань, эмблема — пустой белый круг</text>

<text x="910.0" y="293.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">(Д-7, без букв).</text>

<text x="900.0" y="310.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Молот — тёмное дерево, железный обод. Без надписей: тексты — в</text>

<text x="910.0" y="327.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">данных (#186).</text>

<text x="900.0" y="352.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Ключевые детали</text>

<text x="900.0" y="372.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Пустой капюшон: лица нет (Д-3 «б»).</text>

<text x="900.0" y="389.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Колени торчат из-под плаща, правая рука тянется к записке на</text>

<text x="910.0" y="406.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">полу, левая на колене.</text>

<text x="900.0" y="423.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Кепка упала к колену — единственный узнаваемый мотив героя.</text>

<text x="900.0" y="440.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Цепь с кандальной гирей — отдельный предмет-подбор</text>

<text x="910.0" y="457.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">(DreamWeaponPickup), не в модели.</text>

<text x="900.0" y="482.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Поза</text>

<text x="900.0" y="502.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Сидит, спиной к стене ниши, обмяк вперёд. Статичная модель,</text>

<text x="910.0" y="519.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">без рига, коллизия — простая.</text>

<text x="900.0" y="544.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Масштаб</text>

