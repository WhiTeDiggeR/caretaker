<text x="32" y="44" font-size="24" font-weight="700" fill="#efe7dc">Н-01 · Останки героя мира — лежат под плащом, ниша у цепи</text>
<text x="32" y="70" font-size="14" fill="#b0a59c">Двор S3, Yard/Remains: «ОСМОТРЕТЬ ОСТАНКИ», рядом цепь с грузом. Решение автора: не сидят, а лежат, накрыты плащом, из-под него торчат кости. Сейчас: dream_hero_remains.gltf (скрипт)</text>
