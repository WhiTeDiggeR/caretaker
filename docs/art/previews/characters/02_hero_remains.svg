<text x="900.0" y="112.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Палитра</text>

<rect x="900" y="118" width="22" height="22" rx="4" fill="#3d3431" stroke="#3a3238"/>
<text x="930.0" y="133.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">истлевший плащ</text>

<text x="930.0" y="145.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#3d3431</text>

<rect x="1140" y="118" width="22" height="22" rx="4" fill="#564943" stroke="#3a3238"/>
<text x="1170.0" y="133.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">кромка, капюшон</text>

<text x="1170.0" y="145.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#564943</text>

<rect x="900" y="146" width="22" height="22" rx="4" fill="#cfc4b4" stroke="#3a3238"/>
<text x="930.0" y="161.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">кости</text>

<text x="930.0" y="173.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#cfc4b4</text>

<rect x="1140" y="146" width="22" height="22" rx="4" fill="#a8382c" stroke="#3a3238"/>
<text x="1170.0" y="161.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">кепка, вытертая</text>

<text x="1170.0" y="173.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#a8382c</text>

<rect x="900" y="174" width="22" height="22" rx="4" fill="#e8e2d6" stroke="#3a3238"/>
<text x="930.0" y="189.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">пустой круг-эмблема</text>

<text x="930.0" y="201.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#e8e2d6</text>

<rect x="1140" y="174" width="22" height="22" rx="4" fill="#6b4a2e" stroke="#3a3238"/>
<text x="1170.0" y="189.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">молот, дерево</text>

<text x="1170.0" y="201.0" font-size="10" fill="#b0a59c" text-anchor="start" font-weight="400">#6b4a2e</text>

<text x="900.0" y="222.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Материалы</text>

<text x="900.0" y="242.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Плащ — грубая шерсть, тяжёлые складки по форме тела, рваный</text>

<text x="910.0" y="259.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">подол, пыль и пепел.</text>

<text x="900.0" y="276.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Кости — матовые, тёплые, без глянца. Кепка — выцветшая красная</text>

<text x="910.0" y="293.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">ткань, эмблема — пустой круг (Д-7).</text>

<text x="900.0" y="310.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Молот — тёмное дерево, железный обод. Без надписей: тексты — в</text>

<text x="910.0" y="327.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">данных (#186).</text>

<text x="900.0" y="352.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Ключевые детали</text>

<text x="900.0" y="372.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Плащ накрывает всё тело с головой; капюшон пустой и тёмный</text>

<text x="910.0" y="389.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">(Д-3 «б», В-7).</text>

<text x="900.0" y="406.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Из-под подола торчат голени и стопы, сбоку — кисть, тянется к</text>

<text x="910.0" y="423.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">записке (В-1 «а»).</text>

<text x="900.0" y="440.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Кепка упала у головы — единственный узнаваемый мотив героя.</text>

<text x="900.0" y="457.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Цепь с кандальной гирей — отдельный подбор</text>

<text x="910.0" y="474.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">(DreamWeaponPickup), не в модели.</text>

<text x="900.0" y="499.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Поза</text>

<text x="900.0" y="519.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Лежит на спине вдоль ниши, головой к стене; по складкам</text>

<text x="910.0" y="536.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">читаются плечи, таз, колени.</text>

<text x="900.0" y="553.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Статика, без рига, коллизия — низкий бокс. Сцена: точка</text>

<text x="910.0" y="570.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">осмотра опускается к полу.</text>

<text x="900.0" y="595.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Масштаб</text>

<text x="900.0" y="615.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• ≈ 1,75 × 0,7 × 0,3 м без молота; плащ шире тела на 0,1 м с</text>

<text x="910.0" y="632.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">боков.</text>

<text x="900.0" y="657.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Канон</text>

<text x="900.0" y="677.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• #186: останки — герой этого мира, побеждённый хозяином (Б-1,</text>

<text x="910.0" y="694.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Б-12). Д-3, Д-4 в docs/art/dream-bowser-s.md; сцена —</text>

<text x="910.0" y="711.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">docs/game_design/06-bowser-dream-world.md §5.</text>

<text x="900.0" y="736.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Для генерации (этап 2)</text>

<text x="900.0" y="756.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Статика: до 8 тыс. треугольников, 1K. Кепку, молот, записку —</text>

<text x="910.0" y="773.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">отдельными мешами.</text>

</svg>
