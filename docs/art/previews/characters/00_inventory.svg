<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" font-family="'PT Sans', Arial, sans-serif">
<defs>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
<radialGradient id="eyeg"><stop offset="0" stop-color="#ff7a2a" stop-opacity="0.8"/><stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/></radialGradient>
<radialGradient id="whiteg"><stop offset="0" stop-color="#eef6ff" stop-opacity="0.8"/><stop offset="1" stop-color="#eef6ff" stop-opacity="0"/></radialGradient>
<linearGradient id="fluid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24506e"/><stop offset="1" stop-color="#173248"/></linearGradient>
<linearGradient id="frost" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd3df" stop-opacity="0.55"/><stop offset="1" stop-color="#bcd3df" stop-opacity="0.25"/></linearGradient>
</defs>
<rect width="1400" height="700" rx="14" fill="#141016"/>
<text x="32" y="44" font-size="24" font-weight="700" fill="#efe7dc">Инвентаризация персонажных моделей (#225)</text>
<text x="32" y="70" font-size="14" fill="#b0a59c">Что заменяем генерацией, где оно в игре и какой файл сейчас. Пакеты генерации — этап 2, после одобрения</text>
<rect x="24" y="90" width="1352" height="34" rx="6" fill="#2c252c"/><text x="32.0" y="112.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Код</text>
<text x="110.0" y="112.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Персонаж</text>
<text x="290.0" y="112.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Где в игре</text>
<text x="560.0" y="112.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Текущий файл</text>
<text x="850.0" y="112.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Как подключено</text>
<text x="1200.0" y="112.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Решение</text>
<rect x="24" y="128" width="1352" height="56" rx="6" fill="#221c22"/><text x="32.0" y="152.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">С-01</text>
<text x="110.0" y="152.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Страж сна (3 варианта)</text>
<text x="290.0" y="152.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Сон Боузера, двор S3: засада,</text>
<text x="290.0" y="169.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">2 шт.</text>
<text x="560.0" y="152.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">dream_shade_guard.gltf</text>
<text x="560.0" y="169.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">(loads/props)</text>
<text x="850.0" y="152.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">data/dreams/combat.json →</text>
<text x="850.0" y="169.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">ambushes.bowser_first_fight.art</text>
<text x="1200.0" y="152.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="700">заменить, с ригом (В-10)</text>
<text x="32.0" y="214.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Н-01</text>
<text x="110.0" y="214.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Останки героя мира</text>
<text x="290.0" y="214.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Сон Боузера, ниша у цепи</text>
<text x="290.0" y="231.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">(Yard/Remains)</text>
<text x="560.0" y="214.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">dream_hero_remains.gltf</text>
<text x="560.0" y="231.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">(loads/props)</text>
<text x="850.0" y="214.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">scenes/dreams/bowser_dream.tscn →</text>
<text x="850.0" y="231.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Yard/Remains/Art</text>
<text x="1200.0" y="214.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="700">лёжа под плащом, статика</text>
<rect x="24" y="252" width="1352" height="56" rx="6" fill="#221c22"/><text x="32.0" y="276.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Ст-01</text>
<text x="110.0" y="276.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Останки старшего</text>
<text x="290.0" y="276.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Комплекс, L-OLD-</text>
<text x="290.0" y="293.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">CORE/senior_room</text>
<text x="560.0" y="276.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">бокс + труба в breach_station.gd</text>
<text x="850.0" y="276.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">_build_body(); в комплексе модели</text>
<text x="850.0" y="293.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">нет</text>
<text x="1200.0" y="276.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="700">новая, статика</text>
<text x="32.0" y="338.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">P-106s</text>
<text x="110.0" y="338.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Херобрин, объект №3</text>
<text x="290.0" y="338.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Комплекс, капсула №3</text>
<text x="560.0" y="338.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">objects/art/sleeper_herobrine.tscn</text>
<text x="850.0" y="338.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">prisoner_capsule_herobrine.tscn</text>
<text x="850.0" y="355.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">(make_capsule_assemblies.py)</text>
<text x="1200.0" y="338.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="700">см. В-3</text>
<rect x="24" y="376" width="1352" height="56" rx="6" fill="#221c22"/><text x="32.0" y="400.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">—</text>
<text x="110.0" y="400.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Спящий сотрудник</text>
<text x="290.0" y="400.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Капсульный зал персонала</text>
<text x="560.0" y="400.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">objects/props/staff_capsule.gd</text>
<text x="850.0" y="400.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">_build_sleeper(), примитивы в коде</text>
<text x="1200.0" y="400.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="700">заменить, после #224</text>
<text x="32.0" y="462.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">P-106s</text>
<text x="110.0" y="462.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">Боузер, объект №4</text>
<text x="290.0" y="462.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">Комплекс, капсула №4</text>
<text x="560.0" y="462.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">objects/art/sleeper_bowser.tscn</text>
<text x="850.0" y="462.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">пакет уже есть:</text>
<text x="850.0" y="479.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">docs/art/gen/bowser (#162)</text>
<text x="1200.0" y="462.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">вне задачи</text>
<rect x="24" y="500" width="1352" height="56" rx="6" fill="#221c22"/><text x="32.0" y="524.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Д-02</text>
<text x="110.0" y="524.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Статуи стражей</text>
<text x="290.0" y="524.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Сон Боузера, двор (план)</text>
<text x="560.0" y="524.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">— (ещё не сделаны)</text>
<text x="850.0" y="524.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">docs/art/dream-bowser-s.md: «поза</text>
<text x="850.0" y="541.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">С-01, камень»</text>
<text x="1200.0" y="524.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="700">из меша С-01</text>
<text x="32.0" y="586.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">—</text>
<text x="110.0" y="586.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">Враги тестового сна</text>
<text x="290.0" y="586.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">scenes/dreams/test_dream.tscn</text>
<text x="560.0" y="586.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">CapsuleMesh в dream_enemy.gd</text>
<text x="850.0" y="586.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">отладочная сцена</text>
<text x="1200.0" y="586.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">не менять</text>
<text x="32.0" y="658.0" font-size="13" fill="#b0a59c" text-anchor="start" font-weight="400">Не персонажи и в задачу не входят: след гибели оператора (декаль Н-05), рамка ниши стража (К-02), цепь с гирей (подбор). Объекты №1, №2, №5–6 моделей пока не имеют.</text>
</svg>
