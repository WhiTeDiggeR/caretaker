<text x="900.0" y="222.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Материалы</text>

<text x="900.0" y="242.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Плотный рабочий комбинезон с отражающей полосой, мягкая обувь,</text>

<text x="910.0" y="259.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">медицинский датчик на запястье.</text>

<text x="900.0" y="276.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Под крышкой видна только форма: детали лица не нужны, важны</text>

<text x="910.0" y="293.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">силуэт и цвет.</text>

<text x="900.0" y="318.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Ключевые детали</text>

<text x="900.0" y="338.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Значок-пропуск на груди (без текста), полоса на поясе и</text>

<text x="910.0" y="355.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">рукавах.</text>

<text x="900.0" y="372.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• 2–3 варианта текстуры (волосы, тон кожи, цвет нашивки), один</text>

<text x="910.0" y="389.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">меш.</text>

<text x="900.0" y="414.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Поза</text>

<text x="900.0" y="434.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• Лежит на спине, руки вдоль тела, голова чуть повёрнута.</text>

<text x="910.0" y="451.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Статика, без рига.</text>

<text x="900.0" y="476.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Масштаб</text>

<text x="900.0" y="496.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• 1,75 м (SLEEPER_HEIGHT), капсула рассчитана до 2,0 м и 0,6 м в</text>

<text x="910.0" y="513.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">плечах.</text>

<text x="900.0" y="538.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Канон</text>

<text x="900.0" y="558.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• docs/world/03-complex.md: персонал спит в аварийных капсулах.</text>

<text x="910.0" y="575.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">Капсула и зал — #210, #224; модель только заменяет примитив.</text>

<text x="900.0" y="600.0" font-size="14" fill="#ffb35a" text-anchor="start" font-weight="700">Для генерации (этап 2)</text>

<text x="900.0" y="620.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">• До 6 тыс. треугольников, 1K. Низкий приоритет: виден сквозь</text>

<text x="910.0" y="637.0" font-size="13" fill="#efe7dc" text-anchor="start" font-weight="400">матовое стекло.</text>

</svg>
