<text x="32" y="70" font-size="14" fill="#b0a59c">Капсульный зал персонала, staff_capsule_occupied: виден силуэтом под матовой крышкой. Сейчас: примитивы в staff_capsule.gd (_build_sleeper). Подключение — после #224</text>
