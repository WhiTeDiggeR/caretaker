>а. Панцирный воин · 2,6 м</text>
<text x="360.0" y="524.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">Шипастый панцирь, рога, тяжёлые руки.</text>
<text x="360.0" y="542.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">Самый узнаваемый (Б-2). Реком.</text>
<text x="640.0" y="504.0" font-size="14" fill="#efe7dc" text-anchor="middle" font-weight="700">б. Костяной страж · 2,3 м</text>
<text x="640.0" y="524.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">Остов с обломками панциря.</text>
<text x="640.0" y="542.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">Мрачнее, хорошо в «тени»; читается хуже.</text>
<text x="920.0" y="504.0" font-size="14" fill="#efe7dc" text-anchor="middle" font-weight="700">в. Пустой доспех · 2,8 м</text>
<text x="920.0" y="524.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">Латы, внутри дым.</text>
<text x="920.0" y="542.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">Нейтральный, слабее связан с фан-образом.</text>
<text x="1160.0" y="590.0" font-size="12" fill="#b0a59c" text-anchor="end" font-weight="400">Без скелета в S: цельный меш + шейдер дыма, движение — смещение и наклон (DreamEnemy). До 15 000 тр.</text>
