<text x="32" y="44" font-size="24" font-weight="700" fill="#efe7dc">Стражи-тени: три варианта силуэта (решение Д-2)</text>
<text x="32" y="70" font-size="14" fill="#b0a59c">Концепт DB-С. Один тип стража на S. Материал «тень»: почти чёрный, дымный край, тлеющие глаза #ff7a2a. Белого на стражах нет — белый принадлежит печати.</text>
