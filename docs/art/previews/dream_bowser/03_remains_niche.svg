<text x="1100.0" y="296.0" font-size="11" fill="#b0a59c" text-anchor="middle" font-weight="400">сильный фан-мотив</text>
<text x="790.0" y="340.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Останки — НЕЙТРАЛЬНЫЕ: пустой доспех человеческого роста,</text>
<text x="790.0" y="360.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">без костей и лица, без знаков принадлежности. Подходит</text>
<text x="790.0" y="380.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">к любой трактовке (#181: «чьи останки» не решено).</text>
<text x="790.0" y="400.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Тексты осмотра — в данных (#186), не в модели.</text>
<text x="790.0" y="420.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400"></text>
<text x="790.0" y="440.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Цепь-образ: звенья 0,15 м, длина 1,6 м, груз Ø 0,4 м.</text>
<text x="790.0" y="460.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Узлы: Chain (подбор), Emit_Chain (вспышка), Weight.</text>
<text x="790.0" y="480.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Метка — декаль DT-10 со вторым слоем свечения.</text>
<text x="790.0" y="500.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Жаровня 1,0 × 1,3 м, узел Fire (частицы + OmniLight).</text>
<text x="790.0" y="520.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Упавшая колонна — вариант К-03, без новой модели.</text>
