<text x="170.0" y="876.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">тусклое белое мерцание; РЕКОМ.</text>
<circle cx="530" cy="770" r="72.0" fill="#2b2427"/><ellipse cx="530" cy="738.5" rx="9.9" ry="9.9" fill="#eef6ff" opacity="0.22"/><path d="M516.5,749.8 L543.5,749.8 L539.0,810.5 L521.0,810.5 Z" fill="#eef6ff" opacity="0.22"/><text x="530.0" y="858.0" font-size="13" fill="#efe7dc" text-anchor="middle" font-weight="600">б. Бледный отпечаток силуэта</text>
<text x="530.0" y="876.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">читается сразу — подсказка слишком явная</text>
