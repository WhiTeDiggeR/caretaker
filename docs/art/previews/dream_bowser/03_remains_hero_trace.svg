<text x="32" y="44" font-size="24" font-weight="700" fill="#efe7dc">Останки героя мира, его оружие, записка, жаровня · след гибели оператора</text>
<text x="32" y="70" font-size="14" fill="#b0a59c">Концепт DB-Н по решению автора в #186. Ниша 4 × 3 м в СЗ углу двора: слева до засады, справа отклик. Внизу — след гибели оператора сразу за WakeLine.</text>
