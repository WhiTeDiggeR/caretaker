<text x="564.0" y="550.0" font-size="13" fill="#efe7dc" text-anchor="middle" font-weight="600">Отклик: цепь белая, жаровня тёплая</text>
<path d="M741.6,450.4 L760.8,450.4 L759.4,479.2 L757.0,520.0 L752.6,520.0 L751.2,481.6 L749.8,520.0 L745.4,520.0 L743.0,479.2 Z" fill="#d9d2c8"/><circle cx="751.2" cy="441.8" r="6.2" fill="#d9d2c8"/><text x="751.2" y="536.0" font-size="11" fill="#b0a59c" text-anchor="middle" font-weight="400">1,8 м</text>

<text x="790.0" y="120.0" font-size="15" fill="#efe7dc" text-anchor="start" font-weight="700">Как показать героя мира — решение Д-3</text>
<text x="790.0" y="144.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">а. Узнаваемый герой-соперник целиком (силуэт,</text>
<text x="790.0" y="162.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">   одежда). Сильнейший фан-мотив, риск О-10, жёстко.</text>
<text x="790.0" y="180.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">б. Останки под истлевшим плащом, лица нет; один</text>
<text x="790.0" y="198.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">   узнаваемый мотив — головной убор рядом.  РЕКОМ.</text>
<text x="790.0" y="216.0" font-size="12" fill="#efe7dc" text-anchor="start" font-weight="400">в. Только вещи: убор, плащ, оружие. Нейтрально,</text>
<text x="790.0" y="234.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">   «герой» читается слабо — держится на записке.</text>
<text x="790.0" y="272.0" font-size="15" fill="#efe7dc" text-anchor="start" font-weight="700">Груз на цепи — решение Д-4</text>
<circle cx="830" cy="335" r="22.0" fill="#1a1718" stroke="#5a5254" stroke-width="2"/><ellipse cx="830" cy="305" rx="8.8" ry="11.0" fill="none" stroke="#5a5254" stroke-width="4"/><text x="830.0" y="377.0" font-size="12" fill="#efe7dc" text-anchor="middle" font-weight="600">а. Кандальная гиря</text>
<text x="830.0" y="392.0" font-size="11" fill="#b0a59c" text-anchor="middle" font-weight="400">РЕКОМ.: оковы, не оружие</text>
<circle cx="965" cy="335" r="19.8" fill="#1a1718" stroke="#5a5254" stroke-width="2"/><line x1="984.8" y1="335.0" x2="998.0" y2="335.0" stroke="#cfc4b4" stroke-width="4" stroke-linecap="round"/><line x1="979.0" y1="349.0" x2="988.3" y2="358.3" stroke="#cfc4b4" stroke-width="4" stroke-linecap="round"/><line x1="965.0" y1="354.8" x2="965.0" y2="368.0" stroke="#cfc4b4" stroke-width="4" stroke-linecap="round"/><line x1="951.0" y1="349.0" x2="941.7" y2="358.3" stroke="#cfc4b4" stroke-width="4" stroke-linecap="round"/><line x1="945.2" y1="335.0" x2="932.0" y2="335.0" stroke="#cfc4b4" stroke-width="4" stroke-linecap="round"/><line x1="951.0" y1="321.0" x2="941.7" y2="311.7" stroke="#cfc4b4" stroke-width="4" stroke-linecap="round"/><line x1="965.0" y1="315.2" x2="965.0" y2="302.0" stroke="#cfc4b4" stroke-width="4" stroke-linecap="round"/><line x1="979.0" y1="321.0" x2="988.3" y2="311.7" stroke="#cfc4b4" stroke-width="4" stroke-linecap="round"/><text x="965.0" y="377.0" font-size="12" fill="#efe7dc" text-anchor="middle" font-weight="600">б. Шипастое ядро</text>
<text x="965.0" y="392.0" font-size="11" fill="#b0a59c" text-anchor="middle" font-weight="400">слишком явное</text>
<path d="M1065,349 Q1095,299 1125,349 Z" fill="#2f6e3a" stroke="#5a5254" stroke-width="2"/><rect x="1063" y="347" width="64" height="7" fill="#d8cfc2"/><path d="M1077.3,329.0 L1082.0,315.5 L1086.7,329.0 Z" fill="#cfc4b4"/>
<path d="M1095.3,329.0 L1100.0,315.5 L1104.7,329.0 Z" fill="#cfc4b4"/>
<text x="1095.0" y="377.0" font-size="12" fill="#efe7dc" text-anchor="middle" font-weight="600">в. Гиря-панцирь</text>
<text x="1095.0" y="392.0" font-size="11" fill="#b0a59c" text-anchor="middle" font-weight="400">вещь хозяина</text>
<text x="790.0" y="427.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Записка предшественника — лист DT-10 у руки;</text>
<text x="790.0" y="446.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">текст только в данных (#186), в модели надписей нет.</text>
<text x="790.0" y="465.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Цепь: звенья 0,15 м, длина 1,6 м, груз Ø 0,4 м.</text>
<text x="790.0" y="484.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Узлы: Body, WeaponSpot/Chain, Emit_Chain, Note, Brazier/Fire.</text>
<text x="790.0" y="503.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Бюджет: останки до 6 000 тр., цепь до 1 500, жаровня до 2 000.</text>
<line x1="40" y1="600" x2="1160" y2="600" stroke="#3a3034"/><text x="40.0" y="632.0" font-size="16" fill="#efe7dc" text-anchor="start" font-weight="700">След гибели оператора за WakeLine — решение Д-5</text>
<text x="40.0" y="654.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Небольшой (≤ 1,2 м), без подписи. Игрок ещё не умирал и не знает, как это выглядит. Тот же след потом оставит смерть игрока —</text>
<text x="40.0" y="672.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">так намёк «расшифровывается» задним числом. Белый (Б-5) — след связи с системой, а не кровь и не тело.</text>
