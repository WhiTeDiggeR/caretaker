<text x="800.0" y="630.0" font-size="12" fill="#b0a59c" text-anchor="middle" font-weight="400">Разрез: диск 8 м, кольца ступенями 0,45 / 0,6 / 0,75 м, ядро — купол 1,2 м</text>
