<text x="640.0" y="217.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">число положений (6 или 8) — по З-5 #188.</text>
<text x="640.0" y="236.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">Бюджет «героя»: до 25 000 тр. на диск со штурвалами;</text>
<text x="640.0" y="255.0" font-size="12" fill="#b0a59c" text-anchor="start" font-weight="400">текстуры 2048² только для DT-08.</text>
