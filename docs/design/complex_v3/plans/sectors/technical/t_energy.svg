<title id="t1title">Детальный план энергетического ядра</title><desc id="t1desc">Генератор доступен через противопожарный тамбур. Щитовая и охлаждение имеют отдельный служебный подход. Операторское окно расположено на общей стене щитовой и генераторного зала; охлаждение соединено с залом только трубными вводами.</desc>
