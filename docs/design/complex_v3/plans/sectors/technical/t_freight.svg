<title id="t6title">Детальный план нижней грузовой зоны</title><desc id="t6desc">Внешний контур тяжёлой магистрали, технической приёмки, грузового лифта, обхода и правого сервисного блока совпадает с грузовыми секторами верхнего и нижнего этажей. Магистраль открывается только в приёмку; главные ворота лифта находятся на общей стене с приёмкой. Прямого грузового входа из магистрали в шахту нет.</desc>
<g id="layer-for-t_freight-space-001" class="layer layer-rooms" data-layer="rooms" data-object-ref="t_freight-space-001"><rect class="corridor" x="70" y="80" width="860" height="170" id="t_freight-space-001" data-kind="space" /></g><g id="layer-for-t_freight-label-001" class="layer layer-labels" data-layer="labels" data-object-ref="t_freight-label-001"><text x="500" y="150" id="t_freight-label-001" class="label" data-kind="label">ТЯЖЁЛАЯ ГРУЗОВАЯ МАГИСТРАЛЬ</text></g><g id="layer-for-t_freight-label-002" class="layer layer-labels" data-layer="labels" data-object-ref="t_freight-label-002"><text class="minor" x="500" y="178" id="t_freight-label-002" data-kind="label">чистая ширина 7–8 м · тот же контур, что на двух основных этажах</text></g>

