<svg viewBox="0 0 900 700" role="img" aria-labelledby="t2title t2desc" xmlns="http://www.w3.org/2000/svg" id="plan-t_workshop" class="plan-root" data-plan-style-id="caretaker-style-b-v1" data-scale="relative" data-scale-policy="legacy-local; metric-handoff-authoritative" data-grid-size="1" data-grid-unit="svg-unit" data-plan-id="t_workshop" data-sector-id="T-WORKSHOP" data-level="LV-T" data-parent-bounds-xz="-65.0,-15.0,-30.0,15.0" data-local-origin-xyz="-65.0,-11.5,-15.0" data-anchor-ids="" data-transition-ids="" data-semantic-layer-contract="per-object-v1">
