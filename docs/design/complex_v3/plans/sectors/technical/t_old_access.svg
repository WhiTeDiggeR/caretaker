<title id="t3title">Детальный план старого технического входа</title><desc id="t3desc">Старая лестница под западной частью старого ядра выходит в отдельный вестибюль. Вестибюль независимо связан с главным коридором и боковым тупиковым доступом к подстанции старого ядра.</desc>
