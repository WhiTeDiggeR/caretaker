<title id="t4title">Детальный план восточного узла</title><desc id="t4desc">Пассажирская шахта занимает западную фиксированную ось и не имеет остановки. Подстанция расположена восточнее шахты, а аварийная лестница — под восточной частью подстанции, как на общем плане. Между отдельными подходами находится закрытый кабельный приямок без прохода. Все обслуживаемые помещения доступны раздельно из главного коридора.</desc>
