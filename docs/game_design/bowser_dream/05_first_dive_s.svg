<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="'PT Sans', 'Segoe UI', Arial, sans-serif">
  <title>Сон Боузера — первое погружение S (набросок, #181)</title>
  <style>
    .s{font-size:11px;fill:#4a3d3a}
    .b{font-size:13px;font-weight:700;fill:#2a2026}
    .h{font-size:20px;font-weight:700;fill:#2a2026}
    .ev{fill:#fff;stroke:#2a2026;stroke-width:1.5}
    .evt{font-size:11px;font-weight:700;fill:#2a2026;text-anchor:middle}
  </style>
  <rect width="1000" height="680" fill="#efe7dc"/>
  <text x="20" y="32" class="h">Первое погружение S: короткое обучение полным циклом</text>
  <text x="20" y="52" class="s">План, 1 м = 9 px. Площадка ~90 × 40 м, путь ~95 м. Переход → путь → бой → печать → врата → ресинхронизация.</text>
  <g transform="translate(0,40)"><rect x="34" y="28" width="900" height="389" fill="#f4a36a"/>
<rect x="70" y="246" width="144" height="108" fill="#d8ccc0" stroke="#3b3236" stroke-width="2"/>
<rect x="214" y="286" width="126" height="27" fill="#d8ccc0" stroke="#3b3236" stroke-width="2"/>
<rect x="340" y="291" width="144" height="18" fill="#b88a6a" stroke="#7a3a1e" stroke-dasharray="6 3"/>
<rect x="484" y="219" width="216" height="162" fill="#c9bdb3" stroke="#3b3236" stroke-width="3"/>
<rect x="700" y="228" width="180" height="144" fill="#a99a90" stroke="#2a2026" stroke-width="3"/>
<rect x="776" y="120" width="27" height="108" fill="#c9bdb3" stroke="#3b3236"/>
<rect x="745" y="48" width="90" height="72" fill="#c9bdb3" stroke="#3b3236" stroke-width="2"/>
<path d="M772 84 v-16 a18 18 0 0 1 36 0 v16" fill="none" stroke="#1a1718" stroke-width="5"/>
<circle cx="790" cy="300" r="36" fill="#8a8078" stroke="#2a2026"/><circle cx="790" cy="300" r="23.400000000000002" fill="none" stroke="#2a2026"/><circle cx="790" cy="300" r="11.700000000000001" fill="#f2f6ff" stroke="#2a2026"/>
<rect x="502" y="219" width="36" height="27" fill="#e2dbd2" stroke="#7d716b" stroke-dasharray="4 3"/>
<rect x="686" y="237" width="14" height="22" fill="#2a2026"/>
<rect x="686" y="340" width="14" height="22" fill="#2a2026"/>
<line x1="304" y1="286.5" x2="304" y2="313.5" stroke="#2a2026" stroke-width="4"/>
<polyline points="124,300 484,300 754,300" fill="none" stroke="#2a2026" stroke-width="2" stroke-dasharray="2 5"/>
<polyline points="826,246 790,228 790,102" fill="none" stroke="#c0281a" stroke-width="3" stroke-dasharray="7 4"/>
<circle cx="106" cy="282" r="11" class="ev"/><text x="106" y="286" class="evt">1</text>
<circle cx="304" cy="271.2" r="11" class="ev"/><text x="304" y="275.2" class="evt">2</text>
<circle cx="520" cy="259.5" r="11" class="ev"/><text x="520" y="263.5" class="evt">3</text>
<circle cx="592" cy="336" r="11" class="ev"/><text x="592" y="340" class="evt">4</text>
<circle cx="790" cy="349.5" r="11" class="ev"/><text x="790" y="353.5" class="evt">5</text>
<circle cx="790" cy="174" r="11" class="ev"/><text x="790" y="178" class="evt">6</text>
<circle cx="790" cy="66" r="11" class="ev"/><text x="790" y="70" class="evt">7</text>
<text x="74" y="370" class="b">S1 Терраса 16×12 м</text>
<text x="218" y="330" class="b">S2 Карниз 14 м</text>
<text x="344" y="325" class="b">Цепной мост 16 м</text>
<text x="488" y="397" class="b">S3 Двор первого боя 24×18 м</text>
<text x="704" y="388" class="b">S4 Зал печати 20×16 м</text>
<text x="844" y="93" class="b">S5 Бастион 10×8 м</text>
<text x="808" y="183" class="s">мост 12 м</text>
<text x="488.5" y="210" class="s">останки + образ</text>
<text x="610" y="210" class="s">ниши стражей</text>
<text x="70" y="84" class="s" style="fill:#8a2f1a">лава: падение = выталкивание</text>
<text x="20" y="430" class="b">Темп сна ≈ 6 мин (без возвращения)</text>
<rect x="70" y="440" width="33" height="26" fill="#8a8078"/><text x="75" y="457" class="s" style="fill:#fff">S0</text>
<rect x="103" y="440" width="77" height="26" fill="#8a6a5e"/><text x="108" y="457" class="s" style="fill:#fff">S1</text>
<rect x="180" y="440" width="110" height="26" fill="#c8642a"/><text x="185" y="457" class="s" style="fill:#fff">S2</text>
<rect x="290" y="440" width="220" height="26" fill="#a3261a"/><text x="295" y="457" class="s" style="fill:#fff">S3 бой</text>
<rect x="510" y="440" width="165" height="26" fill="#6e6460"/><text x="515" y="457" class="s" style="fill:#fff">S4 печать</text>
<rect x="675" y="440" width="55" height="26" fill="#4a4448"/><text x="680" y="457" class="s" style="fill:#fff">S5</text>
<text x="70" y="482" class="s">0</text>
<text x="180" y="482" class="s">1</text>
<text x="290" y="482" class="s">2</text>
<text x="400" y="482" class="s">3</text>
<text x="510" y="482" class="s">4</text>
<text x="620" y="482" class="s">5</text>
<text x="730" y="482" class="s">6</text>
<text x="744" y="482" class="s">мин</text>
<g transform="translate(20,510)"><text class="b">События</text>
<text x="0" y="20" class="s">1 прибытие: вид на крепость и арку врат на бастионе; силуэт №2 (одна фраза)</text>
<text x="0" y="37" class="s">2 перелезть уступ 1,2 м; лава поднимается — «тревога»</text>
<text x="0" y="54" class="s">3 останки «поверженного чужака» в нише, рядом цепь-образ (не светится)</text>
<text x="0" y="71" class="s">4 стражи выходят из ниш → цепь вспыхивает, жаровня у ниши загорается</text>
<text x="490" y="20" class="s">5 печать: 3 кольца, 3 рычага; знаки → журнал</text>
<text x="490" y="37" class="s">6 толчок, боковая дверь открыта, лава поднимается</text>
<text x="490" y="54" class="s">7 арка-врата → кресло → ресинхронизация (#132)</text>
</g>
<g transform="translate(20,612)"><rect width="90" height="6" fill="#2a2026"/><rect x="90" width="90" height="6" fill="#fff" stroke="#2a2026"/><text y="20" class="s">0</text><text x="86" y="20" class="s">10</text><text x="170" y="20" class="s">20 м</text></g>
</g>
</svg>
