<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 870" font-family="'PT Sans', 'Segoe UI', Arial, sans-serif">
  <title>Сон Боузера V2 «Горн» — план ветки от ядра S (набросок, #233)</title>
  <style>
    .s{font-size:11px;fill:#4a3d3a}
    .b{font-size:13px;font-weight:700;fill:#2a2026}
    .h{font-size:20px;font-weight:700;fill:#2a2026}
    .core{fill:#d8ccc0;stroke:#3b3236;stroke-width:2}
    .new{fill:#c9bdb3;stroke:#2a2026;stroke-width:3}
    .opt{fill:#e6ddd2;stroke:#2a2026;stroke-width:2;stroke-dasharray:7 4}
    .lava{fill:#e8742f}
    .crust{fill:#8a5a44}
    .route{fill:none;stroke:#2a2026;stroke-width:2.5;stroke-dasharray:2 5;stroke-linecap:round}
    .back{fill:none;stroke:#ffffff;stroke-width:2.5;stroke-dasharray:8 5}
    .ev{fill:#fff;stroke:#2a2026;stroke-width:1.5}
    .evt{font-size:11px;font-weight:700;fill:#2a2026;text-anchor:middle}
  </style>
  <rect width="1000" height="870" fill="#efe7dc"/>
  <text x="20" y="32" class="h">V2 «Горн»: ядро S + ветка «Кузница» через южный завал двора</text>
  <text x="20" y="52" class="s">План, 1 м = 9 px, координаты сцены bowser_dream (x вправо, z вниз). Серое — ядро S без изменений геометрии; тёмная обводка — новая ветка; пунктир — необязательная зона.</text>
  <text x="20" y="68" class="s">Путь туда ~85 м, обратно ~70 м. Ориентир 10–15 мин игры во сне (1 : 15).</text>

  <!-- lava field -->
  <rect x="34" y="96" width="930" height="690" class="lava"/>

  <!-- core S: terrace, path, yard, hall, bastion -->
  <rect x="50" y="290" width="144" height="108" class="core"/>
  <text x="122" y="340" class="b" text-anchor="middle">Терраса</text>
  <text x="122" y="356" class="s" text-anchor="middle">16 × 12, вход</text>
  <rect x="194" y="331" width="270" height="27" class="core"/>
  <text x="329" y="349" class="s" text-anchor="middle">карниз и цепной мост (цепи раскалены)</text>
  <rect x="464" y="263" width="216" height="162" class="core"/>
  <text x="500" y="285" class="b">Двор</text>
  <text x="500" y="300" class="s">24 × 18, тихо (сон помнит V1)</text>
  <rect x="470" y="276" width="22" height="18" fill="#7a6a62"/>
  <text x="498" y="318" class="s">останки и цепь — снова здесь</text>
  <rect x="680" y="272" width="180" height="144" class="core"/>
  <text x="770" y="330" class="b" text-anchor="middle">Зал печати Трона</text>
  <text x="770" y="346" class="s" text-anchor="middle">печать цела (V1), зал открыт</text>
  <circle cx="770" cy="380" r="22" fill="#fff" stroke="#2a2026"/>
  <rect x="806" y="218" width="18" height="54" class="core"/>
  <rect x="770" y="128" width="90" height="90" class="core"/>
  <text x="815" y="166" class="b" text-anchor="middle">Бастион</text>
  <path d="M795 140 a20 20 0 0 1 40 0 v-20 h-40 z" fill="#fff" stroke="#2a2026"/>
  <text x="815" y="196" class="s" text-anchor="middle">врата (выход)</text>

  <!-- branch hooks of S that stay closed -->
  <rect x="604" y="252" width="34" height="9" fill="#5a4a44"/>
  <text x="642" y="250" class="s">обрушенная лестница — V3</text>

  <!-- melted rubble passage -->
  <rect x="590" y="425" width="36" height="42" class="new"/>
  <text x="634" y="444" class="s">оплавленный завал</text>
  <text x="634" y="458" class="s">(Branches/RubbleSouth)</text>

  <!-- sluice gallery -->
  <rect x="446" y="467" width="360" height="90" class="new"/>
  <text x="456" y="486" class="b">Шлюзовая галерея 40 × 10</text>
  <rect x="446" y="530" width="360" height="27" class="lava"/>
  <text x="626" y="548" class="s" text-anchor="middle" fill="#2a2026">канал подачи лавы к Горну →</text>
  <rect x="500" y="520" width="10" height="46" fill="#2a2026"/>
  <rect x="626" y="520" width="10" height="46" fill="#2a2026"/>
  <rect x="752" y="520" width="10" height="46" fill="#2a2026"/>
  <text x="514" y="526" class="b">Ш1</text>
  <text x="640" y="526" class="b">Ш2</text>
  <text x="766" y="526" class="b">Ш3</text>
  <rect x="456" y="495" width="80" height="12" fill="#fff" stroke="#2a2026"/>
  <text x="496" y="504" class="s" text-anchor="middle">барельеф-схема</text>
  <circle cx="470" cy="520" r="6" fill="#4a3d3a"/>
  <text x="480" y="524" class="s">К1</text>
  <circle cx="790" cy="490" r="6" fill="#4a3d3a"/>
  <text x="778" y="482" class="s">К2</text>
  <!-- guard niches in gallery -->
  <rect x="690" y="467" width="20" height="10" fill="#2a2026"/>
  <rect x="560" y="467" width="20" height="10" fill="#2a2026"/>

  <!-- quench tank and diversion channel -->
  <rect x="446" y="557" width="54" height="80" fill="#6f8c96" stroke="#2a2026" stroke-width="2"/>
  <text x="452" y="600" class="s" fill="#ffffff">закалочный</text>
  <text x="452" y="614" class="s" fill="#ffffff">чан</text>
  <rect x="380" y="530" width="66" height="27" class="lava"/>
  <text x="384" y="524" class="s">отвод</text>

  <!-- forge hall -->
  <rect x="554" y="578" width="216" height="162" class="new"/>
  <rect x="644" y="557" width="36" height="21" class="new"/>
  <text x="564" y="598" class="b">Зал Горна 24 × 18</text>
  <text x="564" y="614" class="s">святыня: стражи не входят</text>
  <circle cx="662" cy="668" r="36" fill="#fff4e8" stroke="#2a2026" stroke-width="2"/>
  <circle cx="662" cy="668" r="25" fill="none" stroke="#e8742f" stroke-width="3"/>
  <circle cx="662" cy="668" r="14" fill="none" stroke="#e8742f" stroke-width="3"/>
  <text x="662" y="720" class="s" text-anchor="middle">печать Горна Ø 8, 3 кольца</text>

  <!-- optional cooled workshop -->
  <rect x="806" y="467" width="108" height="108" class="opt"/>
  <rect x="806" y="467" width="18" height="108" class="crust"/>
  <text x="832" y="490" class="b">Остывший цех</text>
  <text x="832" y="506" class="s">12 × 12, необязат.</text>
  <text x="832" y="522" class="s">ров застывает</text>
  <text x="832" y="536" class="s">после Ш3</text>
  <rect x="890" y="548" width="16" height="16" fill="#fff" stroke="#2a2026"/>
  <text x="832" y="560" class="s">метка ТН</text>

  <!-- route in / back -->
  <path class="route" d="M122 344 L470 344 L560 344 L608 420 L608 470 L470 500 L470 520 L790 500 L757 545 L662 560 L662 640"/>
  <path class="back" d="M672 640 L672 562 L616 470 L616 420 L700 344 L800 300 L815 230 L815 150"/>

  <!-- events -->
  <g>
    <circle cx="120" cy="300" r="11" class="ev"/><text x="120" y="304" class="evt">1</text>
    <circle cx="580" cy="400" r="11" class="ev"/><text x="580" y="404" class="evt">2</text>
    <circle cx="600" cy="508" r="11" class="ev"/><text x="600" y="512" class="evt">3</text>
    <circle cx="720" cy="500" r="11" class="ev"/><text x="720" y="504" class="evt">4</text>
    <circle cx="700" cy="640" r="11" class="ev"/><text x="700" y="644" class="evt">5</text>
    <circle cx="880" cy="530" r="11" class="ev"/><text x="880" y="534" class="evt">6</text>
    <circle cx="840" cy="250" r="11" class="ev"/><text x="840" y="254" class="evt">7</text>
  </g>

  <!-- legend -->
  <g transform="translate(34,800)">
    <text x="0" y="0" class="s">1 Вход: жар, лава выше, дым из-за двора   2 Завал во дворе прогорел — проход в Кузницу   3 Барельеф-схема, К1, засада при снятии первого ключ-камня</text>
    <text x="0" y="16" class="s">4 Шлюзы: Ш1 «перепуск» открыть → Ш2 «подача» закрыть → Ш3 «закалка» на ступень N (порядок = схема охлаждения)   5 Печать Горна: кольца остывают и начинают вращаться</text>
    <text x="0" y="48" class="s">Чёрные прямоугольники на северной стене галереи — ниши стражей; К1, К2 — ключ-камни; белый пунктир — путь обратно.</text>
    <text x="0" y="32" class="s">6 Необязательно: метка старшего сотрудника (Б-12)   7 Обратно через ядро, врата на бастионе → межсонье → кресло → ресинхронизация и настройка охлаждения</text>
  </g>
</svg>
