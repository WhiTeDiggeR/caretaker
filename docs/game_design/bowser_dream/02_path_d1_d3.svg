<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="'PT Sans', 'Segoe UI', Arial, sans-serif">
  <title>Сон Боузера — путь D1–D3 (набросок, #167)</title>
  <style>
    .t{font-size:13px;fill:#2a2026}
    .s{font-size:11px;fill:#4a3d3a}
    .b{font-size:13px;font-weight:700;fill:#2a2026}
    .h{font-size:20px;font-weight:700;fill:#2a2026}
    .ev{fill:#fff;stroke:#2a2026;stroke-width:1.5}
    .evt{font-size:11px;font-weight:700;fill:#2a2026;text-anchor:middle}
  </style>
  <rect width="1100" height="700" fill="#efe7dc"/>
  <text x="20" y="32" class="h">Путь D1–D3: от террасы до подъёмного моста (развёртка ~245 м)</text>
  <text x="20" y="52" class="s">Горизонталь: 1 м = 4 px (по оси пути). Полоса плана — ширина условная, подписана в метрах. Ниже — профиль высот над уровнем лавы.</text>

  <!-- PLAN STRIP -->
  <text x="20" y="84" class="b">План</text>
  <rect x="60" y="95" width="120" height="60" fill="#d8ccc0" stroke="#3b3236"/>
  <rect x="180" y="105" width="100" height="40" fill="#cfc2b6" stroke="#3b3236"/>
  <rect x="280" y="115" width="160" height="20" fill="#cfc2b6" stroke="#3b3236"/>
  <rect x="440" y="119" width="140" height="12" fill="#b88a6a" stroke="#7a3a1e" stroke-dasharray="6 3"/>
  <rect x="580" y="110" width="140" height="30" fill="#cfc2b6" stroke="#3b3236"/>
  <rect x="720" y="112" width="40" height="26" fill="#b9aea6" stroke="#3b3236"/>
  <rect x="760" y="119" width="120" height="12" fill="#b88a6a" stroke="#7a3a1e" stroke-dasharray="6 3"/>
  <rect x="880" y="95" width="80" height="60" fill="#d8ccc0" stroke="#3b3236"/>
  <rect x="960" y="117" width="80" height="16" fill="#7a3a1e"/>
  <rect x="440" y="90" width="140" height="70" fill="#f4a36a" opacity=".45"/>
  <rect x="760" y="90" width="120" height="70" fill="#f4a36a" opacity=".45"/>
  <rect x="960" y="90" width="80" height="70" fill="#f4a36a" opacity=".45"/>
  <circle cx="610" cy="125" r="7" fill="#e8a21c" stroke="#8a2f1a"/>
  <circle cx="650" cy="125" r="7" fill="#e8a21c" stroke="#8a2f1a"/>
  <circle cx="690" cy="125" r="7" fill="#e8a21c" stroke="#8a2f1a"/>
  <rect x="895" y="100" width="12" height="12" fill="#3b3236"/>
  <rect x="915" y="100" width="12" height="12" fill="#3b3236"/>
  <rect x="935" y="100" width="12" height="12" fill="#3b3236"/>
  <g class="s">
    <text x="62" y="175">Терраса D1</text><text x="62" y="189">25 м шир.</text>
    <text x="182" y="207">Спуск</text><text x="182" y="221">ступени 0,5 м + пандус</text>
    <text x="282" y="175">Карниз над лавой</text><text x="282" y="189">3 м шир.</text>
    <text x="442" y="207">Цепной мост №1</text><text x="442" y="221">35 м, 2 м шир., качается</text>
    <text x="582" y="175">Площадки, 3 гейзера</text><text x="582" y="189">ритм 4 с, окно 2 с</text>
    <text x="722" y="207">Обвал</text><text x="722" y="221">перелезть 1,2 м</text>
    <text x="762" y="175">Цепной мост №2</text><text x="762" y="189">30 м</text>
    <text x="882" y="207">Предвратье D3</text><text x="882" y="221">3 противовеса</text>
    <text x="962" y="175">Подъёмный мост</text><text x="962" y="189">ров 20 м</text>
  </g>
  <!-- distance ticks -->
  <g stroke="#2a2026"><path d="M60 80v8M180 80v8M280 80v8M440 80v8M580 80v8M720 80v8M760 80v8M880 80v8M960 80v8M1040 80v8"/></g>
  <g class="s" text-anchor="middle">
    <text x="60" y="76">0</text><text x="180" y="76">30</text><text x="280" y="76">55</text><text x="440" y="76">95</text><text x="580" y="76">130</text><text x="720" y="76">165</text><text x="760" y="76">175</text><text x="880" y="76">205</text><text x="960" y="76">225</text><text x="1040" y="76">245 м</text>
  </g>

  <!-- PROFILE -->
  <text x="20" y="250" class="b">Профиль</text>
  <rect x="40" y="400" width="1020" height="30" fill="#f4a36a"/>
  <text x="48" y="420" class="s" fill="#8a2f1a">уровень лавы (0 м); на «тревоге» поднимается на 1 м, на «беспокойстве» — на 2 м</text>
  <path d="M60 320 H180 L280 376 H440 Q510 400 580 372 H720 L720 380 H760 L760 368 Q820 384 880 360 H960 L1040 360" fill="none" stroke="#3b3236" stroke-width="4"/>
  <rect x="1040" y="272" width="16" height="88" fill="#3b3236"/>
  <text x="985" y="266" class="s">ворота 22 м</text>
  <rect x="890" y="300" width="10" height="60" fill="#5a4e48"/><rect x="920" y="290" width="10" height="70" fill="#5a4e48"/><rect x="950" y="300" width="10" height="60" fill="#5a4e48"/>
  <g class="s">
    <text x="64" y="312">+20 м</text><text x="300" y="368">+6 м</text><text x="590" y="364">+7 м</text>
  </g>
  <!-- hero scale -->
  <rect x="150" y="313" width="3" height="7" fill="#c0281a"/>
  <text x="120" y="300" class="s" fill="#c0281a">герой 1,8 м</text>
  <!-- events on profile -->
  <circle cx="148" cy="270" r="10" class="ev"/><text x="148" y="274" class="evt">1</text>
  <circle cx="330" cy="340" r="10" class="ev"/><text x="330" y="344" class="evt">2</text>
  <circle cx="650" cy="340" r="10" class="ev"/><text x="650" y="344" class="evt">3</text>
  <circle cx="740" cy="345" r="10" class="ev"/><text x="740" y="349" class="evt">3</text>
  <circle cx="820" cy="400" r="10" class="ev"/><text x="820" y="404" class="evt">✦</text>
  <circle cx="920" cy="270" r="10" class="ev"/><text x="920" y="274" class="evt">4</text>

  <!-- TIMING -->
  <text x="20" y="462" class="b">Темп</text>
  <rect x="60" y="450" width="220" height="18" fill="#d8ccc0"/><text x="66" y="463" class="s">D1 ≈ 2 мин: осмотр, силуэт</text>
  <rect x="280" y="450" width="600" height="18" fill="#e9c9a8"/><text x="286" y="463" class="s">D2 ≈ 4 мин: движение, тайминг гейзеров, «мир тревожится»</text>
  <rect x="880" y="450" width="160" height="18" fill="#cfc2b6"/><text x="886" y="463" class="s">D3 ≈ 4 мин</text>

  <!-- INSET D3 -->
  <text x="20" y="500" class="b">Предвратье D3 (план, 1 м = 6 px)</text>
  <rect x="60" y="515" width="240" height="150" fill="#d8ccc0" stroke="#3b3236" stroke-width="2"/>
  <rect x="300" y="515" width="120" height="150" fill="#f4a36a"/>
  <rect x="300" y="575" width="120" height="30" fill="#b88a6a" stroke="#7a3a1e" stroke-dasharray="6 3"/>
  <rect x="420" y="515" width="14" height="150" fill="#3b3236"/>
  <text x="310" y="568" class="s">мост поднят</text>
  <g>
    <rect x="80" y="525" width="34" height="34" fill="#5a4e48"/><text x="91" y="547" class="b" fill="#fff">Л</text>
    <rect x="163" y="525" width="34" height="34" fill="#5a4e48"/><text x="174" y="547" class="b" fill="#fff">Ц</text>
    <rect x="80" y="620" width="34" height="34" fill="#5a4e48"/><text x="91" y="642" class="b" fill="#fff">П</text>
    <circle cx="230" cy="590" r="16" fill="#e8a21c" stroke="#8a2f1a" stroke-width="2"/><text x="214" y="625" class="s">ворот</text>
    <rect x="425" y="560" width="8" height="60" fill="#b8913a"/>
  </g>
  <text x="66" y="684" class="s">40 × 25 м; вход с моста №2 слева</text>
  <g transform="translate(460,520)" class="t">
    <text x="0" y="0" class="b">Головоломка моста</text>
    <text x="0" y="22" class="s">• Три противовеса на цепях: Л, Ц, П. Каждый опускается своим воротом (RepairControl, масштаб ×2,5).</text>
    <text x="0" y="40" class="s">• Порядок читается на барельефе ворот (золотая полоса справа): три сцены, у каждой — знак башни.</text>
    <text x="0" y="58" class="s">• Неверный порядок: мост перекашивается и поднимается, противовесы возвращаются (~5 с), гул в крепости.</text>
    <text x="0" y="76" class="s">• Подсказка при 2-й ошибке: барельеф подсвечивает первую сцену.</text>
    <text x="0" y="94" class="s">• Порядок фиксирован для первого запуска (его не нужно выносить в комплекс).</text>
    <text x="0" y="112" class="s">• Развилка Р-6: штраф нестабильности за ошибку — да/нет (см. документ).</text>
  </g>
</svg>
