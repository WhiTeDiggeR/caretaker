<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'PT Sans', 'Segoe UI', Arial, sans-serif">
  <title>Сон Боузера — зона первого боя и оружие у останков (набросок, #181)</title>
  <style>
    .s{font-size:11px;fill:#4a3d3a}
    .b{font-size:13px;font-weight:700;fill:#2a2026}
    .h{font-size:20px;font-weight:700;fill:#2a2026}
    .ev{fill:#fff;stroke:#2a2026;stroke-width:1.5}
    .evt{font-size:11px;font-weight:700;fill:#2a2026;text-anchor:middle}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2a2026"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3f8f4a"/></marker>
  </defs>
  <rect width="1000" height="620" fill="#efe7dc"/>
  <text x="20" y="32" class="h">S3: зона первого боя и оружие у следов прежнего оператора</text>
  <text x="20" y="52" class="s">План, 1 м = 20 px. Оружие не видно как оружие до боя; после появления стражей мир показывает, где оно.</text>
  <rect x="10" y="90" width="560" height="400" fill="#f4a36a"/>
<rect x="50" y="110" width="480" height="360" fill="#c9bdb3" stroke="#3b3236" stroke-width="4"/>
<rect x="10" y="270" width="42.0" height="40" fill="#b88a6a" stroke="#7a3a1e" stroke-dasharray="6 3"/>
<line x1="50" y1="250" x2="50" y2="330" stroke="#c9bdb3" stroke-width="6"/>
<line x1="530" y1="250" x2="530" y2="330" stroke="#efe7dc" stroke-width="6"/>
<rect x="530" y="250" width="40" height="80" fill="#a99a90" stroke="#2a2026"/>
<rect x="90" y="110" width="80" height="60" fill="#9a8c84" stroke="#2a2026" stroke-width="2"/>
<ellipse cx="122.0" cy="136.0" rx="22" ry="10" fill="#e8e0d4" stroke="#2a2026"/>
<path d="M142.0 148.0 q12 8 26 2" fill="none" stroke="#5a4e48" stroke-width="4"/><circle cx="168.0" cy="150.0" r="6" fill="#5a4e48"/>
<circle cx="190" cy="130" r="9" fill="#3b3236" stroke="#2a2026"/>
<rect x="100.0" y="182.0" width="90.0" height="24.0" fill="#8a7c74" stroke="#2a2026" transform="rotate(-12 140.0 194.0)"/>
<rect x="176.0" y="110" width="28.0" height="6" fill="#f2f6ff" stroke="#2a2026"/>
<rect x="270" y="190" width="40" height="40" fill="#6e6460"/>
<rect x="270" y="350" width="40" height="40" fill="#6e6460"/>
<rect x="500.0" y="150" width="30.0" height="50.0" fill="#2a2026"/>
<rect x="500.0" y="390" width="30.0" height="50.0" fill="#2a2026"/>
<line x1="250" y1="110" x2="250" y2="470" stroke="#c0281a" stroke-width="2" stroke-dasharray="8 5"/>
<text x="254" y="458.0" class="s" style="fill:#c0281a">линия пробуждения (x = 10 м)</text>
<line x1="70" y1="290" x2="130" y2="150" stroke="#2a2026" stroke-dasharray="2 4"/>
<line x1="270" y1="290" x2="150" y2="150" stroke="#e8a21c" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M500.0 174.0 L350 250" stroke="#2a2026" stroke-width="2" marker-end="url(#a)"/>
<path d="M500.0 414.0 L350 330" stroke="#2a2026" stroke-width="2" marker-end="url(#a)"/>
<path d="M20.0 290 L270 290" stroke="#3f8f4a" stroke-width="3"/>
<path d="M270 290 Q210 210 160.0 174.0" fill="none" stroke="#3f8f4a" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#g)"/>
<line x1="522.0" y1="250" x2="522.0" y2="330" stroke="#f2f6ff" stroke-width="4"/>
<circle cx="74.0" cy="234.0" r="11" class="ev"/><text x="74.0" y="238.0" class="evt">1</text>
<circle cx="130" cy="98.0" r="11" class="ev"/><text x="130" y="102.0" class="evt">2</text>
<circle cx="262.0" cy="270" r="11" class="ev"/><text x="262.0" y="274" class="evt">3</text>
<circle cx="430" cy="200.0" r="11" class="ev"/><text x="430" y="204.0" class="evt">4</text>
<circle cx="202.0" cy="198.0" r="11" class="ev"/><text x="202.0" y="202.0" class="evt">5</text>
<circle cx="486.0" cy="290" r="11" class="ev"/><text x="486.0" y="294" class="evt">6</text>
<text x="74.0" y="82.0" class="s">ниша 4×3 м: останки + цепь-образ, метка оператора</text>
<text x="202.0" y="144.0" class="s">жаровня</text>
<text x="536.0" y="242.0" class="s">к залу</text>
<text x="10" y="346.0" class="s">с моста</text>
<text x="316.0" y="216.0" class="s">колонна</text>
<text x="316.0" y="376.0" class="s">колонна</text>
<text x="396.0" y="162.0" class="s">ниша стража</text>
<text x="396.0" y="448.0" class="s">ниша стража</text>
<text x="50" y="508.0" class="s">Двор 24 × 18 м; от линии пробуждения до ниши с цепью ≈ 9 м, от стражей до героя ≈ 12 м (≈ 4 с).</text>
<g transform="translate(600,90)">
<text y="0" class="b">Порядок</text>
<text y="17" class="s">1 Вход с моста. Ниша видна слева в полумраке (линия взгляда</text>
<text y="34" class="s">   пунктиром), частично прикрыта упавшей колонной.</text>
<text y="51" class="s">   Цепь лежит у останков тёмной, без свечения и подписи «оружие».</text>
<text y="68" class="s">   Подойти можно: «ОСМОТРЕТЬ ОСТАНКИ» → заметка, затем</text>
<text y="85" class="s">   «ВЗЯТЬ: ЦЕПЬ С ГРУЗОМ». Игрок может пройти мимо.</text>
<text y="102" class="s">2 Метка оператора на стене (Б-12) — короткая фраза.</text>
<text y="119" class="s">3 Герой пересекает линию x = 10 м — сон замечает чужака.</text>
<text y="136" class="s">4 Из ниш выходят 2 стража; 1,5 с «сборки» (телеграф).</text>
<text y="153" class="s">5 В тот же момент — отклик оружия:</text>
<text y="170" class="s">   • цепь вспыхивает белым (цвет печатей и врат, Б-5);</text>
<text y="187" class="s">   • жаровня у ниши загорается — тёплое пятно света;</text>
<text y="204" class="s">   • звон металла из ниши, позиционный звук сзади-слева;</text>
<text y="221" class="s">   • метка оператора светится.</text>
<text y="238" class="s">   Если цепь не взята за 15 с или устойчивость ниже 50 % —</text>
<text y="255" class="s">   одна строка: «У останков что-то откликается».</text>
<text y="272" class="s">6 Порог зала — святыня: стражи не входят.</text>
<text y="289" class="s">   Бой можно обойти (05, правило 2), но в двор</text>
<text y="306" class="s">   на обратном пути не вернуться — дверь за печатью.</text>
<text y="323" class="s"></text>
<text y="340" class="s">После взятия цепи: подсказка ЛКМ один раз.</text>
<text y="357" class="s">Стражи: 2 × «тень» (60 ед., 2 удара цепью).</text>
</g>
<g transform="translate(600,500)"><text class="b">Легенда</text><line x1="0" y1="16" x2="30" y2="16" stroke="#3f8f4a" stroke-width="3"/><text x="36" y="20" class="s">путь героя / отход к цепи</text><line x1="0" y1="34" x2="30" y2="34" stroke="#e8a21c" stroke-width="2" stroke-dasharray="6 4"/><text x="36" y="38" class="s">свет и звук отклика</text><line x1="0" y1="52" x2="30" y2="52" stroke="#2a2026" stroke-dasharray="2 4"/><text x="36" y="56" class="s">линия взгляда при входе</text><line x1="0" y1="70" x2="30" y2="70" stroke="#f2f6ff" stroke-width="4"/><text x="36" y="74" class="s">порог-святыня зала</text></g>
<g transform="translate(50,540)"><rect width="100" height="6" fill="#2a2026"/><rect x="100" width="100" height="6" fill="#fff" stroke="#2a2026"/><text y="20" class="s">0</text><text x="96" y="20" class="s">5</text><text x="188" y="20" class="s">10 м</text></g>
</svg>
