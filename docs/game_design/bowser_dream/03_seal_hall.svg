<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'PT Sans', 'Segoe UI', Arial, sans-serif">
  <title>Сон Боузера — зал печати D4/D5 (набросок, #167)</title>
  <style>
    .t{font-size:13px;fill:#2a2026}
    .s{font-size:11px;fill:#4a3d3a}
    .b{font-size:13px;font-weight:700;fill:#2a2026}
    .h{font-size:20px;font-weight:700;fill:#2a2026}
    .g{font-size:10px;font-weight:700;fill:#2a2026;text-anchor:middle}
    .ev{fill:#fff;stroke:#2a2026;stroke-width:1.5}
    .evt{font-size:11px;font-weight:700;fill:#2a2026;text-anchor:middle}
  </style>
  <rect width="1000" height="700" fill="#efe7dc"/>
  <text x="20" y="32" class="h">Зал печати (D4) и начало отхода (D5)</text>
  <text x="20" y="52" class="s">План: 1 м = 12 px. Зал 44 × 34 м, высота 18 м. Справа — схема колец печати (без масштаба).</text>
  <!-- hall -->
  <rect x="60" y="100" width="528" height="408" fill="#c9bdb3" stroke="#2a2026" stroke-width="4"/>
  <rect x="60" y="100" width="70" height="408" fill="#b5a79d"/>
  <rect x="518" y="100" width="70" height="408" fill="#b5a79d"/>
  <text x="66" y="125" class="s">галерея +4 м</text>
  <text x="522" y="125" class="s">галерея +4 м</text>
  <rect x="64" y="170" width="14" height="26" fill="#2a2026"/><rect x="64" y="250" width="14" height="26" fill="#2a2026"/><rect x="64" y="350" width="14" height="26" fill="#2a2026"/><rect x="64" y="430" width="14" height="26" fill="#2a2026"/><rect x="570" y="170" width="14" height="26" fill="#2a2026"/><rect x="570" y="250" width="14" height="26" fill="#2a2026"/><rect x="570" y="350" width="14" height="26" fill="#2a2026"/><rect x="570" y="430" width="14" height="26" fill="#2a2026"/>
  <circle cx="160" cy="190" r="12" fill="#6e6460"/><circle cx="160" cy="280" r="12" fill="#6e6460"/><circle cx="160" cy="380" r="12" fill="#6e6460"/><circle cx="160" cy="460" r="12" fill="#6e6460"/><circle cx="488" cy="190" r="12" fill="#6e6460"/><circle cx="488" cy="280" r="12" fill="#6e6460"/><circle cx="488" cy="380" r="12" fill="#6e6460"/><circle cx="488" cy="460" r="12" fill="#6e6460"/>
  <!-- lava windows north -->
  <rect x="190" y="96" width="40" height="8" fill="#ff6a1a"/><rect x="418" y="96" width="40" height="8" fill="#ff6a1a"/>
  <!-- throne dais -->
  <rect x="276" y="112" width="96" height="60" fill="#8a7c74" stroke="#2a2026"/>
  <rect x="306" y="118" width="36" height="30" fill="#3b3236"/>
  <text x="290" y="166" class="s" fill="#fff">трон (пустой)</text>
  <!-- seal -->
  <circle cx="324" cy="330" r="88" fill="none" stroke="#f2f6ff" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="324" cy="330" r="72" fill="#8a8078" stroke="#2a2026" stroke-width="2"/>
  <circle cx="324" cy="330" r="52" fill="#9a908a" stroke="#2a2026"/>
  <circle cx="324" cy="330" r="32" fill="#aaa09a" stroke="#2a2026"/>
  <circle cx="324" cy="330" r="12" fill="#f2f6ff" stroke="#2a2026"/>
  <path d="M324 258 L332 290 L318 318" stroke="#f2f6ff" stroke-width="3" fill="none"/>
  <text x="416" y="270" class="s">печать Ø 12 м</text>
  <text x="416" y="284" class="s">столб света сверху</text>
  <!-- ring levers -->
  <rect x="284" y="410" width="14" height="22" fill="#e8a21c" stroke="#8a2f1a"/>
  <rect x="317" y="414" width="14" height="22" fill="#e8a21c" stroke="#8a2f1a"/>
  <rect x="350" y="410" width="14" height="22" fill="#e8a21c" stroke="#8a2f1a"/>
  <text x="370" y="428" class="s">3 рычага-штурвала: кольцо 1/2/3</text>
  <!-- doors -->
  <rect x="282" y="500" width="84" height="16" fill="#efe7dc" stroke="#2a2026"/>
  <path d="M282 508 H366" stroke="#c0281a" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="270" y="535" class="s">вход с коридоров, ворота 7 м (решётка)</text>
  <rect x="582" y="270" width="16" height="60" fill="#efe7dc" stroke="#2a2026"/>
  <text x="604" y="290" class="s">выход к бастиону</text>
  <text x="604" y="304" class="s">открывается после печати</text>
  <path d="M598 300 H660" stroke="#c0281a" stroke-width="3" stroke-dasharray="7 4"/>
  <path d="M652 292 L664 300 L652 308" fill="#c0281a"/>
  <!-- hidden alcove -->
  <rect x="80" y="104" width="44" height="40" fill="#e2dbd2" stroke="#7d716b" stroke-dasharray="5 3"/>
  <!-- events -->
  <circle cx="324" cy="480" r="11" class="ev"/><text x="324" y="484" class="evt">1</text>
  <circle cx="264" cy="422" r="11" class="ev"/><text x="264" y="426" class="evt">2</text>
  <circle cx="324" cy="330" r="11" class="ev"/><text x="324" y="334" class="evt">3</text>
  <circle cx="98" cy="300" r="11" class="ev"/><text x="98" y="304" class="evt">4</text>
  <circle cx="548" cy="300" r="11" class="ev"/><text x="548" y="304" class="evt">4</text>
  <circle cx="630" cy="330" r="11" class="ev"/><text x="630" y="334" class="evt">5</text>
  <circle cx="102" cy="160" r="11" class="ev"/><text x="102" y="164" class="evt">✦</text>
  <!-- scale -->
  <g transform="translate(60,560)">
    <rect width="60" height="6" fill="#2a2026"/><rect x="60" width="60" height="6" fill="#fff" stroke="#2a2026"/>
    <text y="20" class="s">0</text><text x="55" y="20" class="s">5</text><text x="110" y="20" class="s">10 м</text>
  </g>
  <!-- ring detail -->
  <text x="680" y="150" class="b">Кольца печати</text>
  <circle cx="815" cy="330" r="140" fill="none" stroke="#3b3236" stroke-width="2"/><text x="815" y="211" class="g">КОР</text><text x="922" y="272" class="g">ЦЕП</text><text x="922" y="396" class="g">ПЛМ</text><text x="815" y="457" class="g">КЛЮ</text><text x="708" y="396" class="g">ГЛЗ</text><text x="708" y="272" class="g">БШН</text><circle cx="815" cy="330" r="105" fill="none" stroke="#3b3236" stroke-width="2"/><text x="845" y="251" class="g">КОР</text><text x="902" y="319" class="g">ЦЕП</text><text x="872" y="401" class="g">ПЛМ</text><text x="785" y="417" class="g">КЛЮ</text><text x="728" y="349" class="g">ГЛЗ</text><text x="758" y="267" class="g">БШН</text><circle cx="815" cy="330" r="70" fill="none" stroke="#3b3236" stroke-width="2"/><text x="785" y="291" class="g">КОР</text><text x="837" y="286" class="g">ЦЕП</text><text x="868" y="329" class="g">ПЛМ</text><text x="845" y="377" class="g">КЛЮ</text><text x="793" y="382" class="g">ГЛЗ</text><text x="762" y="339" class="g">БШН</text>
  <path d="M815 190 L818 225" stroke="#f2f6ff" stroke-width="5"/><path d="M851 231 L837 264" stroke="#f2f6ff" stroke-width="5"/><path d="M775 273 L809 316" stroke="#f2f6ff" stroke-width="5"/>
  <path d="M807 170 L823 170 L815 184 Z" fill="#c0281a"/>
  <text x="829" y="178" class="s">метка чтения</text>
  <circle cx="815" cy="330" r="35" fill="#f2f6ff" stroke="#2a2026"/>
  <text x="815" y="334" class="g">ядро</text>
  <text x="680" y="500" class="s">Трещина света разорвана: кольца сбиты.</text>
  <text x="680" y="514" class="s">Повернуть каждое кольцо, чтобы линия стала</text>
  <text x="680" y="528" class="s">непрерывной от края до ядра.</text>
  <text x="680" y="546" class="s">Под меткой читаются 3 знака (внешнее → внутреннее)</text>
  <text x="680" y="560" class="s">= последовательность DreamKnowledge (#132).</text>
  <!-- legend events -->
  <g transform="translate(60,600)">
    <text class="b">События</text>
    <text y="18" class="s">1 вход: печать треснула, свет течёт по трещинам; тишина  ·  2 повернуть кольца рычагами (каждый ход — гул, искры с потолка)</text>
    <text y="34" class="s">3 линия замкнулась: знаки записаны в журнал, зал вздрагивает, сон «почувствовал» героя  ·  4 решётка входа падает, стражи выходят из ниш галерей</text>
    <text y="50" class="s">5 боковые ворота открываются — путь к бастиону и вратам  ·  ✦ скрытая ниша за троном: осколок воспоминания (до сборки печати)</text>
  </g>
</svg>
