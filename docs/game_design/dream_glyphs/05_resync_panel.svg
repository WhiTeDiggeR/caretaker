  <title>Знаки снов — макет панели ресинхронизации (набросок, #188)</title>
  <style>
    .s{font-size:11px;fill:#4a3d3a}
    .m{font-size:10px;fill:#4a3d3a;font-family:Consolas,'Courier New',monospace}
    .k{font-size:9px;font-weight:700;letter-spacing:1px;fill:#8a2f1a}
    .b{font-size:14px;font-weight:700;fill:#2a2026}
