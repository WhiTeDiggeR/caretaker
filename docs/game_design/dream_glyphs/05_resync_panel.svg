    .pt{font-family:'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif;fill:#1fb5c8;letter-spacing:1px}
  </style>
  <defs>
    <filter id="glowW" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowP" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity="0.18"/></pattern>
    <radialGradient id="warm" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#5a2a14"/><stop offset="1" stop-color="#1c0f0a"/></radialGradient>
  </defs>
  <rect width="1100" height="800" fill="#f4efe6"/>
<text x="30" y="40" class="h" text-anchor="start">Знаки снов · 05 · Макет панели ресинхронизации капсулы (модуль 4)</text>
<text x="30" y="62" class="s" text-anchor="start">Экран эпохи III (WorldScreen), кнопки — таблички «светлое на тёмном». 8 клавиш-остовов 4 × 2, СБРОС и ВВОД. Код Ф-1… — служебная маркировка клавиш.</text>
<rect x="30" y="84" width="520" height="690" rx="14" fill="#2a2d2f" stroke="#151718" stroke-width="3"/>
<rect x="44" y="98" width="492" height="18" fill="#1e2022"/>
<text x="54" y="111" font-size="10" fill="#8b908c" font-family="'IBM Plex Mono',monospace" letter-spacing="1">ПР-4 · ПАНЕЛЬ РЕСИНХРОНИЗАЦИИ · КАПСУЛА МОДУЛЯ 4</text>
<rect x="510" y="102" width="20" height="10" fill="#3f8f4a"/>
<rect x="64" y="138" width="452" height="262" rx="10" fill="#1a1c1d"/><rect x="70" y="144" width="440" height="250" rx="6" fill="#041114"/><rect x="70" y="144" width="440" height="22" fill="#06191d"/><rect x="78" y="150" width="10" height="10" fill="#3f8f4a"/><text x="96" y="160" class="pt" font-size="12">РЕСИНХРОНИЗАЦИЯ КАПСУЛЫ · МОДУЛЬ 4</text><text x="84" y="188" class="ph" font-size="12" fill="#bfe9ef" style="fill:#bfe9ef">Введите знаки печати:</text><text x="84" y="204" class="ph" font-size="12" fill="#3f7d88" style="fill:#3f7d88">наружное → внутреннее</text><rect x="182.0" y="300" width="64" height="64" rx="3" fill="none" stroke="#bfe9ef" stroke-width="1.5"/><g transform="translate(188.0 306) scale(0.52)"><g filter="url(#glowP)"><path d="M20 80 H80" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 80 V24" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 80 V40" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 80 V24" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="214.0" y="378" class="ph" font-size="9" text-anchor="middle" style="fill:#3f7d88">НАР</text><rect x="258.0" y="300" width="64" height="64" rx="3" fill="none" stroke="#bfe9ef" stroke-width="1.5"/><g transform="translate(264.0 306) scale(0.52)"><g filter="url(#glowP)"><path d="M18 50 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 50 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="290.0" y="378" class="ph" font-size="9" text-anchor="middle" style="fill:#3f7d88">СРЕД</text><rect x="334.0" y="300" width="64" height="64" rx="3" fill="none" stroke="#3f7d88" stroke-width="1.5"/><line x1="353.2" y1="354" x2="378.8" y2="354" stroke="#3f7d88" stroke-width="2"/><text x="366.0" y="378" class="ph" font-size="9" text-anchor="middle" style="fill:#3f7d88">ВНУТР</text><rect x="70" y="144" width="440" height="250" rx="6" fill="url(#scan)"/>
<rect x="78" y="438" width="98" height="92" rx="4" fill="#0b0c0d"/><rect x="78" y="434" width="98" height="92" rx="4" fill="#202325" stroke="#3a3e40"/><g transform="translate(98.48 440) scale(0.5704)"><g><path d="M20 80 H80" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 80 V24" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 80 V40" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 80 V24" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="127.0" y="519" font-size="10" fill="#8b908c" text-anchor="middle" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" letter-spacing="1">Ф-1</text>
<rect x="186" y="438" width="98" height="92" rx="4" fill="#0b0c0d"/><rect x="186" y="437" width="98" height="92" rx="4" fill="#0d0f10" stroke="#3a3e40"/><g transform="translate(206.48 443) scale(0.5704)"><g><path d="M18 50 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 50 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="235.0" y="522" font-size="10" fill="#8b908c" text-anchor="middle" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" letter-spacing="1">Ф-2</text>
<rect x="294" y="438" width="98" height="92" rx="4" fill="#0b0c0d"/><rect x="294" y="434" width="98" height="92" rx="4" fill="#202325" stroke="#3a3e40"/><g transform="translate(314.48 440) scale(0.5704)"><g><path d="M50 88 C18 66 80 44 48 12" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="343.0" y="519" font-size="10" fill="#8b908c" text-anchor="middle" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" letter-spacing="1">Ф-3</text>
<rect x="402" y="438" width="98" height="92" rx="4" fill="#0b0c0d"/><rect x="402" y="434" width="98" height="92" rx="4" fill="#202325" stroke="#3a3e40"/><g transform="translate(422.48 440) scale(0.5704)"><g><path d="M36 26 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 40 V88" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 74 H70" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="451.0" y="519" font-size="10" fill="#8b908c" text-anchor="middle" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" letter-spacing="1">Ф-4</text>
<rect x="78" y="544" width="98" height="92" rx="4" fill="#0b0c0d"/><rect x="78" y="540" width="98" height="92" rx="4" fill="#202325" stroke="#3a3e40"/><g transform="translate(98.48 546) scale(0.5704)"><g><path d="M50 20 L77.7 36 L77.7 68 L50 84 L22.3 68 L22.3 36 Z" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="52" r="8.0" fill="#d9dad5"/></g></g><text x="127.0" y="625" font-size="10" fill="#8b908c" text-anchor="middle" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" letter-spacing="1">Ф-5</text>
<rect x="186" y="544" width="98" height="92" rx="4" fill="#0b0c0d"/><rect x="186" y="540" width="98" height="92" rx="4" fill="#202325" stroke="#3a3e40"/><g transform="translate(206.48 546) scale(0.5704)"><g><path d="M34 14 H66 V86 H34 Z" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 46 H66" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="235.0" y="625" font-size="10" fill="#8b908c" text-anchor="middle" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" letter-spacing="1">Ф-6</text>
<rect x="294" y="544" width="98" height="92" rx="4" fill="#0b0c0d"/><rect x="294" y="540" width="98" height="92" rx="4" fill="#202325" stroke="#3a3e40"/><g transform="translate(314.48 546) scale(0.5704)"><g><path d="M50 14 L80 84 H20 Z" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="343.0" y="625" font-size="10" fill="#8b908c" text-anchor="middle" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" letter-spacing="1">Ф-7</text>
<rect x="402" y="544" width="98" height="92" rx="4" fill="#0b0c0d"/><rect x="402" y="540" width="98" height="92" rx="4" fill="#202325" stroke="#3a3e40"/><g transform="translate(422.48 546) scale(0.5704)"><g><path d="M30 12 V88" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 52 H72 V88" fill="none" stroke="#d9dad5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="451.0" y="625" font-size="10" fill="#8b908c" text-anchor="middle" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" letter-spacing="1">Ф-8</text>
<rect x="78" y="660" width="206" height="50" rx="4" fill="#0b0c0d"/><rect x="78" y="656" width="206" height="50" rx="4" fill="#202325" stroke="#3a3e40"/><text x="181.0" y="699" font-size="10" fill="#8b908c" text-anchor="middle" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" letter-spacing="1"></text>
<rect x="294" y="660" width="206" height="50" rx="4" fill="#0b0c0d"/><rect x="294" y="656" width="206" height="50" rx="4" fill="#202325" stroke="#3a3e40"/><text x="397.0" y="699" font-size="10" fill="#8b908c" text-anchor="middle" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" letter-spacing="1"></text>
<text x="181" y="682" font-size="15" font-weight="700" fill="#d9dad5" text-anchor="middle" font-family="Oswald,'Arial Narrow',sans-serif" letter-spacing="2">СБРОС</text>
<text x="397" y="682" font-size="15" font-weight="700" fill="#d9dad5" text-anchor="middle" font-family="Oswald,'Arial Narrow',sans-serif" letter-spacing="2">ВВОД</text>
<text x="290.0" y="760" font-size="10" fill="#8b908c" text-anchor="middle" font-family="'IBM Plex Mono',monospace">ФАЗОВЫЕ МЕТКИ КАПСУЛЫ · СЕРИЯ КС-3 · НАБОР ОБЩИЙ ДЛЯ ВСЕХ МОДУЛЕЙ</text>
<text x="590" y="96" class="k" text-anchor="start">СОСТОЯНИЯ ЭКРАНА</text>
<rect x="584" y="102" width="312" height="162" rx="10" fill="#1a1c1d"/><rect x="590" y="108" width="300" height="150" rx="6" fill="#041114"/><rect x="590" y="108" width="300" height="22" fill="#06191d"/><rect x="598" y="114" width="10" height="10" fill="#3f8f4a"/><text x="616" y="124" class="pt" font-size="10">РЕСИНХРОНИЗАЦИЯ КАПСУЛЫ · МОДУЛЬ 4</text><text x="604" y="152" class="ph" font-size="12" fill="#bfe9ef" style="fill:#bfe9ef">Нет данных для ресинхронизации.</text><text x="604" y="168" class="ph" font-size="12" fill="#bfe9ef" style="fill:#bfe9ef">Нужны знаки печати из сна модуля:</text><text x="604" y="184" class="ph" font-size="12" fill="#bfe9ef" style="fill:#bfe9ef">погружение → печать → врата.</text><rect x="590" y="108" width="300" height="150" rx="6" fill="url(#scan)"/>
<text x="906" y="128" class="b" text-anchor="start">Нет знаний:</text>
<text x="906" y="148" class="s" text-anchor="start">клавиши недоступны,</text>
<text x="906" y="163" class="s" text-anchor="start">причина «НУЖНЫ ЗНАКИ ИЗ</text>
<text x="906" y="178" class="s" text-anchor="start">СНА»</text>
<rect x="584" y="270" width="312" height="162" rx="10" fill="#1a1c1d"/><rect x="590" y="276" width="300" height="150" rx="6" fill="#041114"/><rect x="590" y="276" width="300" height="22" fill="#06191d"/><rect x="598" y="282" width="10" height="10" fill="#3f8f4a"/><text x="616" y="292" class="pt" font-size="10">РЕСИНХРОНИЗАЦИЯ КАПСУЛЫ · МОДУЛЬ 4</text><text x="604" y="320" class="ph" font-size="12" fill="#d8341f" style="fill:#d8341f">ОШИБКА СИНХРОНИЗАЦИИ.</text><text x="604" y="336" class="ph" font-size="12" fill="#bfe9ef" style="fill:#bfe9ef">Нестабильность выросла. Повторите ввод.</text><rect x="668.0" y="356" width="40" height="40" rx="3" fill="none" stroke="#bfe9ef" stroke-width="1.5"/><g transform="translate(674.0 362) scale(0.28)"><g filter="url(#glowP)"><path d="M20 80 H80" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 80 V24" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 80 V40" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 80 V24" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="688.0" y="410" class="ph" font-size="9" text-anchor="middle" style="fill:#3f7d88">НАР</text><rect x="720.0" y="356" width="40" height="40" rx="3" fill="none" stroke="#bfe9ef" stroke-width="1.5"/><g transform="translate(726.0 362) scale(0.28)"><g filter="url(#glowP)"><path d="M18 50 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 50 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="740.0" y="410" class="ph" font-size="9" text-anchor="middle" style="fill:#3f7d88">СРЕД</text><rect x="772.0" y="356" width="40" height="40" rx="3" fill="none" stroke="#bfe9ef" stroke-width="1.5"/><g transform="translate(778.0 362) scale(0.28)"><g filter="url(#glowP)"><path d="M36 26 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 40 V88" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 74 H70" fill="none" stroke="#bfe9ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="792.0" y="410" class="ph" font-size="9" text-anchor="middle" style="fill:#3f7d88">ВНУТР</text><rect x="590" y="276" width="300" height="150" rx="6" fill="url(#scan)"/>
<text x="906" y="296" class="b" text-anchor="start">Ошибка после ВВОДА:</text>
<text x="906" y="316" class="s" text-anchor="start">слоты держатся 1,5 с,</text>
<text x="906" y="331" class="s" text-anchor="start">затем очищаются</text>
<rect x="584" y="438" width="312" height="162" rx="10" fill="#1a1c1d"/><rect x="590" y="444" width="300" height="150" rx="6" fill="#041114"/><rect x="590" y="444" width="300" height="22" fill="#06191d"/><rect x="598" y="450" width="10" height="10" fill="#3f8f4a"/><text x="616" y="460" class="pt" font-size="10">РЕСИНХРОНИЗАЦИЯ КАПСУЛЫ · МОДУЛЬ 4</text><text x="604" y="488" class="ph" font-size="12" fill="#3ed36b" style="fill:#3ed36b">СИНХРОНИЗАЦИЯ ЗАВЕРШЕНА.</text><text x="604" y="504" class="ph" font-size="12" fill="#bfe9ef" style="fill:#bfe9ef">Сон стабилен.</text><rect x="590" y="444" width="300" height="150" rx="6" fill="url(#scan)"/>
<text x="906" y="464" class="b" text-anchor="start">Совпало:</text>
<text x="906" y="484" class="s" text-anchor="start">стабильность 100 %,</text>
<text x="906" y="499" class="s" text-anchor="start">прогноз исчезает</text>
<text x="590" y="640" class="k" text-anchor="start">ВЗАИМОДЕЙСТВИЕ (предложение)</text>
<text x="590" y="660" class="s" text-anchor="start">— клавиша → знак встаёт в следующий слот; подсказка «ВВЕСТИ ЗНАК · Ф-2»</text>
<text x="590" y="678" class="s" text-anchor="start">— проверки нет, пока не нажат ВВОД: ошибку в наборе можно СБРОСИТЬ даром</text>
<text x="590" y="696" class="s" text-anchor="start">— ВВОД с неполным кодом недоступен: «НУЖНО 3 ЗНАКА»</text>
<text x="590" y="714" class="s" text-anchor="start">— неверный ВВОД: +5 нестабильности (как сейчас), строка тревоги словом</text>
<text x="590" y="732" class="s" text-anchor="start">— остов на клавише — тот же, что вспыхнул на кольце и в журнале</text>
</svg>
